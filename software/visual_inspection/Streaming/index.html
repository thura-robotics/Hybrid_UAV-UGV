<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Video Streaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100 text-gray-900 dark:bg-gray-900 dark:text-gray-200">
    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-bold text-center mb-6">WebRTC Video Streaming</h1>

        <div class="flex justify-center mb-6">
            <div class="flex flex-col items-center w-full max-w-4xl">
                <span class="text-sm font-semibold text-gray-500 mb-1 uppercase tracking-wide">
                    Live Camera
                </span>
                <!--
                    autoplay    : start as soon as srcObject is assigned
                    playsinline : prevent iOS Safari going fullscreen
                    muted       : REQUIRED for Chrome/Edge/Android autoplay
                                  policy — unmuted video is blocked silently
                -->
                <video id="remoteVideo" autoplay playsinline muted
                    class="border rounded w-full bg-black aspect-video object-cover"></video>
            </div>
        </div>

        <div class="flex flex-wrap justify-center gap-3 mb-4">
            <button id="connectButton"
                class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-5 rounded transition-colors duration-200">
                <i class="fas fa-plug mr-2"></i>Connect
            </button>
            <button id="disconnectButton" disabled
                class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-5 rounded transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
                <i class="fas fa-times mr-2"></i>Disconnect
            </button>
            <button id="toggleDetectionButton" disabled
                class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-5 rounded transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
                <i class="fas fa-eye mr-2"></i>Toggle Detection
            </button>
            <button id="snapshotButton" disabled
                class="bg-purple-600 hover:bg-purple-800 text-white font-bold py-2 px-5 rounded transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
                <i class="fas fa-camera mr-2"></i>Snapshot
            </button>
        </div>

        <div class="text-center mt-2">
            <p id="statusText" class="text-sm text-gray-500 dark:text-gray-400">Status: Disconnected</p>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
